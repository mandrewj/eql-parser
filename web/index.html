<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EQL Parser</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #14161a; color: #e6e8eb; margin: 0; padding: 2rem;
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      .sub { color: #8a929c; margin: 0 0 1.5rem; font-size: 0.9rem; }
      .card {
        background: #1c1f26; border: 1px solid #2a2f39; border-radius: 10px;
        padding: 1rem 1.25rem; max-width: 720px; margin-bottom: 1rem;
      }
      label { display: block; font-size: 0.8rem; color: #8a929c; margin-bottom: 0.4rem; }
      select {
        width: 100%; padding: 0.5rem; background: #14161a; color: #e6e8eb;
        border: 1px solid #2a2f39; border-radius: 6px; font-size: 0.95rem;
      }
      .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #d9534f; }
      .dot.on { background: #4cae4c; }
      .muted { color: #8a929c; }
      code { background: #14161a; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>EQL Parser</h1>
    <p class="sub">Local DPS parser for EverQuest Legends — M0 scaffold</p>

    <div class="card">
      <label for="logPicker">Active log</label>
      <select id="logPicker"><option>Loading…</option></select>
      <p class="muted" id="logDir" style="margin: 0.6rem 0 0; font-size: 0.8rem;"></p>
    </div>

    <div class="card">
      <div class="status">
        <span class="dot" id="sseDot"></span>
        <span id="sseStatus">Connecting to live stream…</span>
      </div>
    </div>

    <p class="muted" style="font-size: 0.8rem; max-width: 720px;">
      The live meter, filters, and fight history land in later milestones. For now this
      confirms the server is up, lists your logs, and lets you pick which one to parse.
    </p>

    <script>
      const picker = document.getElementById("logPicker");
      const logDirEl = document.getElementById("logDir");
      const sseDot = document.getElementById("sseDot");
      const sseStatus = document.getElementById("sseStatus");

      async function loadLogs() {
        const res = await fetch("/api/logs");
        const data = await res.json();
        logDirEl.textContent = data.logDir
          ? "Directory: " + data.logDir
          : "No log directory found — set EQL_LOG_DIR.";
        picker.innerHTML = "";
        if (!data.logs.length) {
          picker.innerHTML = "<option>(no eqlog_*.txt found)</option>";
          return;
        }
        for (const log of data.logs) {
          const opt = document.createElement("option");
          opt.value = log.path;
          const who = log.character ? log.character + " (" + (log.server || "?") + ")" : log.fileName;
          const kb = Math.round(log.sizeBytes / 1024);
          opt.textContent = who + " — " + kb + " KB";
          if (log.path === data.activeLogPath) opt.selected = true;
          picker.appendChild(opt);
        }
      }

      picker.addEventListener("change", async () => {
        await fetch("/api/logs/active", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: picker.value, mode: "live" }),
        });
      });

      function connectSse() {
        const es = new EventSource("/events");
        es.onopen = () => {
          sseDot.classList.add("on");
          sseStatus.textContent = "Live stream connected";
        };
        es.onmessage = (e) => {
          try {
            const msg = JSON.parse(e.data);
            if (msg.t === "activeLogChanged") {
              sseStatus.textContent = "Active log changed";
            }
          } catch {}
        };
        es.onerror = () => {
          sseDot.classList.remove("on");
          sseStatus.textContent = "Reconnecting…";
        };
      }

      loadLogs();
      connectSse();
    </script>
  </body>
</html>
